<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>image2PPT 自动验证</title>
<style>
body{font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif;background:#f3f6fa;color:#183047;margin:0}main{max-width:1000px;margin:44px auto;padding:0 24px}h1{font-size:30px;margin-bottom:4px}p{color:#50657a}.card{background:white;border:1px solid #dbe3ec;border-radius:14px;padding:24px;margin-top:22px}button,.download{border:0;border-radius:7px;background:#145cad;color:white;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5;cursor:default}select,input{font:inherit}select{padding:8px;margin:8px}ol{padding-left:24px}li{margin:8px 0}li button{padding:2px 9px;margin-left:8px;background:#e4edf7;color:#183047}#message{white-space:pre-wrap;color:#8c3512}#progress{white-space:pre-wrap;background:#f4f7fb;padding:16px;border-radius:8px}.artifact{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px;border-bottom:1px solid #e4ebf3}small{color:#607487}.badge{display:inline-block;border-radius:20px;padding:3px 11px;background:#e8f0fb;color:#16539a}#jobs button{margin:5px;background:#edf3fa;color:#183047}label{display:block;margin:12px 0}
</style>
<main><span class="badge">区域决策 v2 · 本机验证</span><h1>图片 → 可编辑 PPT</h1>
<p>上传原始图片，自动完成区域划分、重建决策、生成、分离复检与有限修正。保留原文和版式。</p>
<section class="card"><h2>新建任务</h2><input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple><ol id="order"></ol>
<label>还原偏好 <select id="preference"><option value="faithful_editable">保持原貌，优先可编辑文字与简单图形</option><option value="fidelity_first">视觉保真优先，披露保留为图片的区域</option></select></label>
<label>先验证的页码 <input id="gate" placeholder="默认前 3 页；例如 5,8,12" style="width:260px"></label>
<small>按上方顺序编号。本入口只处理代表页，每页最多 48 次模型请求、90 分钟。其余页面保持未执行。</small><p><button id="submit">开始自动验证</button></p><div id="message" role="alert"></div></section>
<section class="card"><h2>任务进度</h2><div id="jobs"></div><div id="progress" aria-live="polite">尚未选择任务。</div><div id="regions"></div><div id="artifacts"></div><p><small>模型质量检查与人工验收分开记录。下载结果不代表已通过 PowerPoint / WPS 实机验收。</small></p></section></main>
<script>
const token='__SESSION_TOKEN__';let files=[],current=null,jobsSignature='',regionsSignature='';
const $=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'X-Local-Token':token,...options.headers}});if(!r.ok)throw new Error(`请求失败 (${r.status})`);return r.json()}
function order(){const list=$('order');list.replaceChildren();files.forEach((f,i)=>{const li=document.createElement('li');li.append(document.createTextNode(f.name));for(const [label,d] of [['↑',-1],['↓',1]]){const b=document.createElement('button');b.textContent=label;b.disabled=i+d<0||i+d>=files.length;b.onclick=()=>{[files[i],files[i+d]]=[files[i+d],files[i]];order()};li.append(b)}list.append(li)})}
$('files').onchange=e=>{files=Array.from(e.target.files);order()};
$('submit').onclick=async()=>{if(!files.length){$('message').textContent='请先选择图片。';return}$('submit').disabled=true;$('message').textContent='正在上传原始图片…';try{const data=new FormData();files.forEach(f=>data.append('files',f));data.append('preference',$('preference').value);data.append('gate_pages',$('gate').value.trim());const job=await api('/v1/auto-jobs',{method:'POST',body:data});current=job.job_id;$('message').textContent='任务已提交，可以在下方查看进度。';await refresh()}catch(e){$('message').textContent=e.message}finally{$('submit').disabled=false}};
function renderRegions(state){
const signature=current+':'+state.status+':'+state.current_page+':'+JSON.stringify(state.pages||{});if(signature===regionsSignature)return;regionsSignature=signature;
const host=$('regions');host.replaceChildren();
for(const [pid,page] of Object.entries(state.pages||{})){
 const group=document.createElement('details');const title=document.createElement('summary');
 title.textContent=`${pid} 区域结果 · ${(page.regions||[]).length} 个区域 · ${page.machine_quality_status}${state.status==='RUNNING'&&state.current_page===pid?'（上次结果，当前正在重试）':''}`;group.append(title);
 for(const region of page.regions||[]){const item=document.createElement('details');const heading=document.createElement('summary');
 heading.textContent=`${region.id} · ${region.decision.decision} · ${region.execution_status||'BUILT'} · ${region.quality_status} · 原生文字 ${region.native_text_ids.length} / 图片内文字 ${region.retained_text_ids.length}`;
 item.append(heading);const body=document.createElement('pre');body.style.whiteSpace='pre-wrap';
 body.textContent=JSON.stringify({decision:region.decision,mapping:region.mapping,issues:region.issues},null,2);item.append(body);group.append(item)}
 for(const error of page.errors||[]){const line=document.createElement('p');line.textContent=error.code;group.append(line)}
 host.append(group)
}}
async function refresh(){try{const jobs=await api('/v1/auto-jobs');const signature=jobs.map(j=>j.job_id+':'+j.status).join('|');if(signature!==jobsSignature){jobsSignature=signature;$('jobs').replaceChildren();jobs.forEach(j=>{const b=document.createElement('button');b.textContent=j.job_id+' · '+j.status;b.onclick=()=>{current=j.job_id;refresh()};$('jobs').append(b)});}if(!current)return;const s=await api('/v1/auto-jobs/'+current);renderRegions(s);const rows=[`流程版本：${s.pipeline_version||1}`,`任务：${current}`,`状态：${s.status}`,`阶段：${s.stage==='finished'?'已结束':(s.page_progress?.stage||s.stage)}`,s.current_page?`当前页面：${s.current_page}`:'',s.page_progress?.model_requests!=null?`本页模型请求：${s.page_progress.model_requests} 次`:'',s.selected_model?`模型：${s.selected_model}`:'',s.error?`错误：${s.error}`:'',s.skipped_pages?.length?`后续未执行：${s.skipped_pages.join(', ')}`:''];for(const [id,p] of Object.entries(s.pages||{}))rows.push(`${id}：${p.execution_status} / ${p.machine_quality_status}，模型请求 ${p.model_requests} 次`);$('progress').textContent=rows.filter(Boolean).join('\n');$('artifacts').replaceChildren();for(const a of s.artifacts||[]){const row=document.createElement('div');row.className='artifact';const label=document.createElement('span');label.textContent=a.name;const b=document.createElement('button');b.textContent='下载';b.onclick=async()=>{const r=await fetch('/v1/auto-jobs/'+current+'/artifacts/'+encodeURIComponent(a.name),{headers:{'X-Local-Token':token}});if(!r.ok)return;const url=URL.createObjectURL(await r.blob());const link=document.createElement('a');link.href=url;link.download=a.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};row.append(label,b);$('artifacts').append(row)}}catch(e){$('progress').textContent=e.message}}
refresh();setInterval(refresh,4000);
</script></html>
